[options]
fullscreen = true
background = 000000
scaling_mode = full
loop_input = true
suppress_default_binds = true
# imv expands these with wordexp(3): ( ) and | must stay inside quotes or $( )
title_text = "p(bloom) Wallpapers — ${imv_current_index}/${imv_file_count} — ${imv_current_file##*/}"
# A bar along the bottom, on from the start: what this is and what the keys do. I hides it.
overlay = true
overlay_position_bottom = true
overlay_font = sans:15
overlay_text_color = d9e8ff
overlay_background_color = 090d16
overlay_background_alpha = e6
# (imv's parser stops at about 200 characters a line; the key hints come from PBLOOM_KEYS, set by the app)
overlay_text = "   $(n=${imv_current_file##*/} && n=${n#*-} && n=${n%.*} && n=${n//-/ } && echo ${n^^})   ${imv_current_index} / ${imv_file_count}${PBLOOM_KEYS}"

[binds]
<Left> = prev
<Right> = next
<Escape> = quit
q = quit
<Home> = goto 1
<End> = goto -1
i = overlay
f = fullscreen
# imv waits for an exec to finish: both run in the background, or the gallery freezes (and S would deadlock)
<Return> = exec setsid -f $PBLOOM_SELF --set-desktop "$imv_current_file" >/dev/null 2>&1
s = exec setsid -f $PBLOOM_SELF "${imv_current_file##*/}" --configure --replace $imv_pid >/dev/null 2>&1
